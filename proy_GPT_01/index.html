<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Álbum de Fotos</title>

    <link rel="stylesheet" href="estilos.css?v=7">

</head>

<body>

<header>

    <button onclick="salir()">Inicio</button>
    <button>Buscar</button>
    <button>Favoritos</button>
    <button>Ayuda</button>

</header>


<main class="galeria" id="galeria">

    <!-- Las CARD se generan automáticamente desde fotos.csv -->

</main>


<!-- ===================================================== -->
<!-- MODAL -->
<!-- ===================================================== -->

<div id="modal">

    <div id="contenidoModal">

        <button id="cerrar" aria-label="Cerrar">&times;</button>

	<div id="pantallaFoto">
	    <img id="imagenModal" src="" alt="">
	</div>

        <div id="infoModal">

            <h2 id="tituloModal"></h2>

            <div id="textoModal"></div>

        </div>

    </div>

</div>

<!-- ===================================================== -->
<!-- MODAL INFORMACIÓN -->
<!-- ===================================================== -->

<div id="modalInfo">

    <div id="contenidoModalInfo">

        <button
            id="cerrarInfo"
            aria-label="Cerrar">&times;</button>


        <img
            id="imagenInfo"
            src=""
            alt="">


        <div id="datosInfo">

            <h2 id="tituloInfo"></h2>


            <div
                id="descripcionInfo">
            </div>


            <div class="datoInfo">

                <strong>Fecha y hora:</strong>

                <span id="fechaInfo">
                </span>

            </div>


            <div class="datoInfo">

                <strong>Ubicación:</strong>

                <span id="ubicacionInfo">
                </span>

            </div>


            <div
                id="mapaInfo">
            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>

<script src="modal.js?v=8"></script>
<script src="album.js?v=2"></script>
<script src="info.js?v=1"></script>


<script>

function salir() {
    document.exitFullscreen();
}

</script>


</body>

</html>
